_schema-version: 3.3.0
ID: BenditaLook
version: 1.0.0
description: "Bendita Look"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - npx tsc server.ts --module node16 --moduleResolution node16 --esModuleInterop --skipLibCheck --target es2022 --outDir gen/srv
modules:

  - name: BenditaLook-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      memory: 256M
      disk-quota: 512M
      buildpack: nodejs_buildpack
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
    properties:
      STORE_NAME: Bendita Look
      STORE_URL: https://davicastr.github.io/SAP-UI5-BenditaLook/index.html
      STORE_WHATSAPP: "558596304756"
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: BenditaLook-db
      - name: BenditaLook-uaa

  - name: BenditaLook-destinations
    type: com.sap.application.content
    requires:
      - name: BenditaLook-uaa
        parameters:
          service-key:
            name: BenditaLook-uaa-key
      - name: BenditaLook-destination
        parameters:
          content-target: true
      - name: srv-api
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: BenditaLook-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: BenditaLook-uaa
              ServiceKeyName: BenditaLook-uaa-key
              sap.cloud.service: BenditaLook
        subaccount:
          existing_destinations_policy: update
          destinations:
            - Name: BenditaLook-srv-api
              Authentication: OAuth2UserTokenExchange
              TokenServiceInstanceName: BenditaLook-uaa
              TokenServiceKeyName: BenditaLook-uaa-key
              URL: ~{srv-api/srv-url}
              HTML5.DynamicDestination: true
              sap.cloud.service: BenditaLook

  - name: BenditaLook-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
    requires:
      - name: BenditaLook-db

resources:

  - name: BenditaLook-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: BenditaLook-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: BenditaLook-uaa-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          redirect-uris:
            - https://*.hana.ondemand.com/**
            - http://localhost:*/**
            - https://davicastr.github.io/**
          credential-types:
            - binding-secret
            - x509

  - name: BenditaLook-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: BenditaLook-srv-api
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true
    requires:
      - name: srv-api
