<!DOCTYPE html>
<html lang="{{language}}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{storeName}}</title>
</head>

<body style="margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; background-color: #fdf1f4; color: #4a3527;">
    <table width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#fdf1f4">
        <tr>
            <td align="center" style="padding: 24px 12px;">
                <table width="600" cellspacing="0" cellpadding="0" border="0"
                    style="max-width: 600px; width: 100%; background-color: #ffffff; border-radius: 14px; overflow: hidden; box-shadow: 0 6px 24px rgba(156, 122, 74, .12);">

                    <tr>
                        <td align="center" bgcolor="#ffcad4" style="background-color: #ffcad4; padding: 20px 28px; border-bottom: 3px solid #a8814f;">
                            <img src="cid:logo" alt="{{storeName}}" width="110" height="110" style="display: block; border-radius: 55px;">
                            <div style="font-size: 15px; color: #7a5a35; margin-top: 10px; font-weight: 700;">{{storeName}}</div>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding: 28px;">
                            <p style="font-size: 18px; font-weight: 600; margin: 0 0 12px;">{{greeting}}</p>

                            <div style="font-size: 15px; line-height: 1.6; color: #4a3527;">{{{body}}}</div>
                        </td>
                    </tr>

                    <tr>
                        <td align="center" style="padding: 20px 28px; background-color: #fdf1f4; border-top: 1px solid #f6e2e7;">
                            {{#if whatsapp}}<div style="font-size: 14px; color: #7a5a35; margin-bottom: 6px;">WhatsApp: {{whatsapp}}</div>{{/if}}
                            {{#if instagram}}<div style="font-size: 14px; color: #7a5a35; margin-bottom: 6px;">{{instagram}}</div>{{/if}}
                            <div style="font-size: 12px; color: #9c7a4a; margin-top: 10px;">{{footer}}</div>
                            <div style="font-size: 11px; color: #b09a80; margin-top: 12px;">
                                <a href="{{unsubscribeUrl}}" style="color: #9c7a4a; text-decoration: underline;">{{unsubscribeLabel}}</a>
                            </div>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>

</html>
