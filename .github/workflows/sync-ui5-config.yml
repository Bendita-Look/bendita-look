name: Sync UI5 configuration

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Start BTP trial]
    types: [completed]

concurrency:
  group: sync-ui5-config
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CF_APP: ${{ vars.CF_APP || 'BenditaLook-srv' }}
      UAA_INSTANCE: ${{ vars.UAA_INSTANCE || 'BenditaLook-uaa' }}
      UAA_KEY: ${{ vars.UAA_KEY || 'BenditaLook-uaa-key' }}
      UI5_REPOSITORY: ${{ vars.UI5_REPOSITORY || 'DaviCastr/SAP-UI5-BenditaLook' }}
      UI5_PAGES_URL: ${{ vars.UI5_PAGES_URL || 'https://davicastr.github.io/SAP-UI5-BenditaLook/' }}
      GIT_AUTHOR_NAME: Davi Castro
      GIT_AUTHOR_EMAIL: davifgeo@gmail.com

    steps:
      - name: Check UI5 repository token
        env:
          UI5_REPO_TOKEN: ${{ secrets.UI5_REPO_TOKEN }}
        run: |
          if [[ -z "$UI5_REPO_TOKEN" ]]; then
            echo "::error::Missing repository secret UI5_REPO_TOKEN (fine-grained token with Contents read and write on ${UI5_REPOSITORY})."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout UI5 repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UI5_REPOSITORY }}
          token: ${{ secrets.UI5_REPO_TOKEN }}
          path: ui5

      - name: Log in to Cloud Foundry
        uses: ./.github/actions/cf-login
        with:
          api: ${{ vars.CF_API || 'https://api.cf.us10-001.hana.ondemand.com' }}
          org: ${{ vars.CF_ORG }}
          space: ${{ vars.CF_SPACE || 'dev' }}
          username: ${{ secrets.CF_USERNAME }}
          password: ${{ secrets.CF_PASSWORD }}

      - name: Update UI5 runtime configuration
        run: bash .github/scripts/sync-ui5-config.sh
